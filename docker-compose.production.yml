# External PostgreSQL and TLS proxy are configured by the deployment operator.
name: rokkad
services:
  web:
    image: ${ROKKAD_IMAGE:?Set an explicitly versioned ROKKAD_IMAGE}
    env_file: .env.production.runtime
    environment:
      DJANGO_SETTINGS_MODULE: ${ROKKAD_PRODUCTION_SETTINGS:-django_project.settings.prod}
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - media:/var/www/rokkad/media
      - staticfiles:/var/www/rokkad/static
    restart: unless-stopped
  migrate:
    image: ${ROKKAD_IMAGE:?Set an explicitly versioned ROKKAD_IMAGE}
    profiles: [tools]
    env_file: .env.production.migration
    environment:
      DJANGO_SETTINGS_MODULE: django_project.settings.migration
    command: ["python", "manage.py", "migrate", "--settings", "django_project.settings.migration", "--noinput"]
  monitoring:
    image: ${ROKKAD_IMAGE:?Set an explicitly versioned ROKKAD_IMAGE}
    profiles: [monitoring]
    env_file: .env.production.runtime
    environment:
      DJANGO_SETTINGS_MODULE: ${ROKKAD_PRODUCTION_SETTINGS:-django_project.settings.prod}
      ROKKAD_MONITOR_WORKSPACE_IDS: ${ROKKAD_MONITOR_WORKSPACE_IDS:-${ROKKAD_MONITOR_WORKSPACE_ID:-}}
      ROKKAD_MONITOR_BATCH_SIZE: ${ROKKAD_MONITOR_BATCH_SIZE:-10}
      ROKKAD_MONITOR_BUSY_SECONDS: ${ROKKAD_MONITOR_BUSY_SECONDS:-5}
      ROKKAD_MONITOR_REPEAT_SECONDS: ${ROKKAD_MONITOR_REPEAT_SECONDS:-300}
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "-u", "scripts/start_monitoring.py"]
    cpus: "0.35"
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 60s
    restart: unless-stopped
volumes:
  media:
  staticfiles:
