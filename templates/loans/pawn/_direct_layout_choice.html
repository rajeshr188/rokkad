<div class="d-flex flex-wrap align-items-center gap-2 mb-3">
  <label class="small" for="direct-layout">Entry layout</label>
  <select class="form-select form-select-sm w-auto" id="direct-layout" name="direct_layout">
    <option value="current" {% if direct_layout != 'simplified' %}selected{% endif %}>Current</option>
    <option value="simplified" {% if direct_layout == 'simplified' %}selected{% endif %}>Simplified (trial)</option>
  </select>
  <noscript><button class="btn btn-sm btn-outline-secondary" type="submit" name="action" value="layout_change" formnovalidate>Apply layout</button><span class="small">Applying a layout reloads the form. Reselect any photographs afterward.</span></noscript>
  <span class="small text-body-secondary">Your choice for this workspace and browser session. Both use the same loan checks.</span>
</div>
<p class="small" role="status" aria-live="polite" data-direct-layout-status></p>
