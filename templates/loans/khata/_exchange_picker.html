<section class="{% if full_width %}col-12{% else %}col-xl-6{% endif %}" data-picker="{{ role }}"><div class="card card-body h-100"><h2 class="h5">{{ heading }}</h2>{{ errors }}
<div class="row g-2 mb-2"><div class="col-8"><label class="small" for="{{ role }}-search">Item ID, UUID, description or storage</label><input id="{{ role }}-search" type="search" data-filter="q" class="form-control" maxlength="160"></div><div class="col-4"><label class="small" for="{{ role }}-metal">Metal</label><select id="{{ role }}-metal" data-filter="metal" class="form-select"><option value="">All metals</option><option value="GOLD">Gold</option><option value="SILVER">Silver</option></select></div><div class="col-4"><label class="small" for="{{ role }}-from">Received from</label><input id="{{ role }}-from" type="date" data-filter="from_date" class="form-control"></div><div class="col-4"><label class="small" for="{{ role }}-through">Received through</label><input id="{{ role }}-through" type="date" data-filter="to_date" class="form-control"></div><div class="col-4"><label class="small" for="{{ role }}-sort">Order</label><select id="{{ role }}-sort" data-filter="sort" class="form-select"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div></div>
<p data-results-status class="small text-muted" role="status" aria-live="polite">Loading collateral...</p>
<div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Select</th><th>Item / photo</th><th>Details / storage</th><th>Suggested value</th></tr></thead><tbody data-results></tbody></table></div>
<div class="d-flex align-items-center justify-content-between"><button type="button" class="btn btn-sm btn-outline-secondary" data-page="previous">Previous</button><span class="small" data-page-label></span><button type="button" class="btn btn-sm btn-outline-secondary" data-page="next">Next</button></div>
<section class="border-top mt-3 pt-3"><h3 class="h6">Selected items</h3><p class="small" data-selected-summary role="status" aria-live="polite"></p><ul class="list-group list-group-flush" data-selected></ul></section>
</div></section>
