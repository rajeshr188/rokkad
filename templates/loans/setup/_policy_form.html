{% load i18n %}
{% partialdef fields %}
{% for field in form.hidden_fields %}{{ field }}{% endfor %}
{% for section in form.sections %}
<fieldset class="mb-3 border-bottom pb-2">
  <legend class="h6">{{ section.title }}</legend>
  <div class="row g-3">{% for field in section.fields %}<div class="col-md-6">{% include "components/forms/accessible.html#field" %}</div>{% endfor %}</div>
</fieldset>
{% endfor %}
{% endpartialdef %}
