{% extends 'base_tenant.html' %}

{% block workspace_content %}
  <div class="container card mt-4">
    <h1>Confirm Delete</h1>
  <p>Are you sure you want to delete this rate?</p>
  <form action="{% url 'workspace_rates:rate_delete' request.workspace.slug rate.id %}" method="POST">
    {% csrf_token %}
    <input type="submit" value="Delete">
    <a class="btn btn-danger" href="{% url 'workspace_rates:rate_list' request.workspace.slug %}">Cancel</a>
  </form>
  </div>
{% endblock %}
