{% extends 'base_tenant.html' %}

{% block workspace_content %}
{% include 'rates/_navigation.html' %}
  <div class="card p-4">
    <h1>Confirm Delete</h1>
  <p>Are you sure you want to delete this {{ rate.metal }} {{ rate.purity }} quote from {{ rate.rate_source }}?</p>
  <form action="{% url 'workspace_rates:rate_delete' request.workspace.slug rate.id %}" method="POST">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-outline-secondary" href="{% url 'workspace_rates:rate_list' request.workspace.slug %}">Cancel</a>
  </form>
  </div>
{% endblock %}
