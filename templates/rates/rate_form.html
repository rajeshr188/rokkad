{% extends 'layouts/workspace.html' %}
{% load crispy_forms_tags %}
{%block content%}
<div class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Rate Form</h1>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" href="{% url 'rate_list' %}">Rates</a>
            <a class="btn btn-outline-primary" href="{% url 'ratesource_create' %}">Add Source</a>
        </div>
    </div>
    {% if not has_rate_sources %}
    <div class="alert alert-warning d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div>A rate source is required before a rate can be saved.</div>
        <a class="btn btn-sm btn-warning" href="{% url 'ratesource_create' %}">Add Rate Source</a>
    </div>
    {% endif %}
    {% crispy form %}
</div>
{%endblock%}
