{% extends 'base_tenant.html' %}
{% load crispy_forms_tags %}
{% block workspace_content %}
{% include 'rates/_navigation.html' %}
<div class="rate-source-page">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">{% if form.instance.pk %}Edit rate source{% else %}Add rate source{% endif %}</h1>
        <a class="btn btn-outline-secondary" href="{% url 'workspace_rates:ratesource_list' request.workspace.slug %}">Rate Sources</a>
    </div>
    <div class="card">
        <div class="card-body">
        {% crispy form %}
        </div>
    </div>
</div>
{%endblock%}
