<div class="modal-header">
    <div>
      {% if customer.id %}
      <h5 class="modal-title mb-1">Update Customer</h5>
      <p class="text-muted small mb-0">Refresh core profile details and relationship info.</p>
      {% else %}
      <h5 class="modal-title mb-1">Create Customer</h5>
      <p class="text-muted small mb-0">Add the core customer profile before filling optional details later.</p>
      {% endif %}
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
  </div>
  <div id="modal-body" class="modal-body">
    <div class="container col-md-11 mt-3 mb-2" id="form">
      {{ form.media }}
      <div class="card border-0 shadow-sm">
        <div class="card-body overflow-hidden">
          {% include 'partials/crispy_form.html' with form=form %}
        </div>
      </div>
    </div>
  </div>
