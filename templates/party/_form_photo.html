{% load i18n %}
<section class="border rounded p-3 mb-3" data-customer-photo aria-labelledby="customer-photo-title"
 data-ready="{% translate 'New photo selected. Save the customer to upload it.' %}"
 data-error="{% translate 'Camera unavailable. Allow camera access on HTTPS, or choose a photo below.' %}"
 data-waiting="{% translate 'Allow camera access, then position the customer in the frame.' %}"
 data-live="{% translate 'Camera is ready. Take a photo when the customer is in view.' %}"
 data-stopped="{% translate 'Camera stopped. Your saved photo is unchanged until you save.' %}"
 data-invalid="{% translate 'Choose an image file. The server will check it when you save.' %}">
  <h2 class="h6" id="customer-photo-title">{% translate "Customer photo" %}</h2>
  <img data-photo-preview {% if party.profile_photo %}src="{% url 'workspace_party:party_photo' workspace_slug=request.workspace.slug pk=party.pk %}"{% else %}hidden{% endif %}
    alt="{% translate 'Customer photo preview' %}" class="img-thumbnail mb-3" style="width:12rem;max-height:16rem;object-fit:contain">
  <div data-photo-camera hidden>
    <video data-photo-video autoplay playsinline muted class="rounded bg-dark w-100" style="max-height:22rem" aria-label="{% translate 'Live camera preview' %}"></video>
  </div>
  <div class="d-flex flex-wrap align-items-end gap-2 mb-2" data-photo-controls hidden>
    <div><label class="form-label small" for="customer-camera-facing">{% translate "Camera" %}</label><select class="form-select" id="customer-camera-facing" data-photo-facing><option value="user">{% translate "Front camera / webcam" %}</option><option value="environment">{% translate "Rear camera" %}</option></select></div>
    <button type="button" class="btn btn-outline-primary" data-photo-start>{% translate "Use camera" %}</button>
    <button type="button" class="btn btn-primary" data-photo-capture disabled>{% translate "Take photo" %}</button>
    <button type="button" class="btn btn-outline-secondary" data-photo-stop disabled>{% translate "Stop camera" %}</button>
    <button type="button" class="btn btn-outline-secondary" data-photo-discard hidden>{% translate "Discard new photo" %}</button>
  </div>
  <p class="small text-body-secondary" data-photo-status role="status" aria-live="polite">{% translate "Preview a camera photo or selected file before saving. Use camera again to retake it." %}</p>
  {% include "components/forms/accessible.html#field" with field=form.profile_photo %}
</section>
