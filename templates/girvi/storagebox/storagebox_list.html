{% extends 'layouts/base.html' %}
{% block content %}
<div class="container">
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h4 class="card-title mb-0">Storage Box List</h4>
          <button class="btn btn-success" hx-get="{% url 'girvi:add_storage_box' %}" hx-target="#storagebox-form" hx-trigger="click">
            Add Storage Box
          </button>
        </div>
        <div class="card-body">
          <div id="storagebox-list">
            {% include 'girvi/storagebox/storagebox_list_partial.html' %}
          </div>
          <div id="storagebox-form" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
