{% load crispy_forms_tags%}
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <h5 class="mb-3">{% if form.instance.pk %}Update{% else %}Add{% endif %} Storage Box</h5>
        {{ form.media }}
        <form
            method="post"
            hx-post="{% if form.instance.pk %}{% url 'girvi:girvi_update_storage_box' form.instance.pk %}{% else %}{% url 'girvi:girvi_add_storage_box' %}{% endif %}"
            hx-target="#storagebox-list"
            hx-swap="outerHTML"
        >
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Save</button>
                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    onclick="this.closest('#storagebox-form').innerHTML = ''"
                >
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
