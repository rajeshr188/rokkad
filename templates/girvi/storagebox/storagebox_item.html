<div class="card border-0 shadow-sm">
    <div class="card-body d-flex justify-content-between align-items-start gap-3">
        <div>
            <h6 class="mb-1">{{ storage_box.name }}</h6>
            <div class="text-muted small">Location: {{ storage_box.location|default:"-" }}</div>
            <div class="text-muted small">Items: {{ storage_box.start_item_id }} to {{ storage_box.end_item_id }}</div>
            <div class="text-muted small">Count: {{ storage_box.items_count }}</div>
        </div>
        <div class="btn-group btn-group-sm">
            <button
                class="btn btn-outline-primary"
                hx-get="{% url 'girvi:girvi_update_storage_box' storage_box.pk %}"
                hx-target="#storagebox-form"
                hx-trigger="click"
            >
                Edit
            </button>
            <button
                class="btn btn-outline-danger"
                hx-post="{% url 'girvi:girvi_delete_storage_box' storage_box.pk %}"
                hx-target="#storagebox-list"
                hx-swap="outerHTML"
                hx-confirm="Delete this storage box?"
            >
                Delete
            </button>
        </div>
    </div>
</div>
