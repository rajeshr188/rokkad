<!-- template to edit series -->
{% extends 'base_tenant.html' %}
{% load crispy_forms_tags%}

{% block workspace_content %}

<div class="container col-md-4 mt-4 mb-4">
  {{form.media}}
  <h1>{% if form.instance.pk %}Update{% else %}Add{% endif %} Series</h1>
  <div class="card">
    <div class="card-body" style="background-color: #eee;">
      <form method="post" class="my-class">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'girvi:girvi_series_list' %}" class="btn btn-outline-secondary">Cancel</a>

      </form>

    </div>
  </div>
</div>

{% endblock %}
