{% load crispy_forms_tags %}
{{ form.media.js }}
<style>
  .select2-dropdown-modal { z-index: 1056 !important; }
  .select2-container--open { z-index: 1056 !important; }
</style>

<div class="modal-header">
  <h5 class="modal-title">{% if loan %}Update Loan{% else %}Create Loan{% endif %}</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<div class="modal-body">
  {% crispy form %}
  <div
    hx-get="{% url 'get_customer_balance' %}"
    hx-trigger="change from:select[name='borrower']"
    hx-target="this"
    hx-swap="innerHTML"
    hx-include="[name='borrower']">
  </div>
</div>

<script>
  (function () {
    const jq = window.jQuery || window.$;

    // Re-run after HTMX swaps the modal content
    function initSelect2Triggers() {
      if (!jq) return;

      jq('#id_series').off('select2:select.loanform').on('select2:select.loanform', function () {
        this.dispatchEvent(new Event('change', { bubbles: true }));
      });
      jq('select[name="borrower"]').off('change.loanform').on('change.loanform', function () {
        this.dispatchEvent(new Event('change', { bubbles: true }));
      });
    }

    if (jq) {
      jq(document).ready(initSelect2Triggers);
    }

    document.body.addEventListener('htmx:afterSwap', function (e) {
      if (e.detail.target && e.detail.target.id === 'modal-content') {
        initSelect2Triggers();
      }
    });
  })();
</script>
