{% if loan.statementitem_set.exists %}
<ul class="list-group mt-3">
  {% for i in loan.statementitem_set.all %}
  <li class="list-group-item">
    Verified: {{i.verified_at}} Statement:
    <a href="{% url 'girvi:statement_detail' i.statement.id %}">{{i.statement.id}}</a>
    Discrepancy: {{i.descrepancy_found}} {{i.descrepancy_note}}
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="mt-3 text-muted">No statement items found.</p>
{% endif %}
