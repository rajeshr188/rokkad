{% extends 'base_tenant.html' %}

{% block workspace_content %}
<div class="container col-lg-6 mt-4 mb-4">
  <div class="card border-danger">
    <div class="card-header bg-danger text-white">
      <h1 class="h5 mb-0">Delete Template</h1>
    </div>
    <div class="card-body">
      <p>Are you sure you want to delete <strong>{{ template_obj.name }}</strong>?</p>
      <p class="text-muted">This will also remove all frames attached to this template.</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger">Delete Template</button>
          <a href="{{ template_obj.get_absolute_url }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
