{% extends 'base_tenant.html' %}
{% load crispy_forms_tags %}

{% block workspace_content %}
<div class="container col-lg-8 mt-4 mb-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1 class="h3 mb-0">{% if frame_obj %}Edit Frame{% else %}Add Frame{% endif %}</h1>
      <p class="text-muted mb-0">Template: {{ template_obj.name }}</p>
    </div>
    <a href="{{ template_obj.get_absolute_url }}" class="btn btn-outline-secondary">Back</a>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-flex gap-2 mt-3">
          <button type="submit" class="btn btn-primary">Save Frame</button>
          <a href="{{ template_obj.get_absolute_url }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
