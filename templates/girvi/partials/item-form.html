{% load static %}
{%load crispy_forms_tags%}

<form id="item-form" enctype="multipart/form-data" hx-post="{% if url %}{{ url }}{% else %}.{% endif%}" hx-target="{% if object %}closest li{% else %}#form{% endif %}" hx-swap="innerHTML">
    {% csrf_token %}
    {%if not object%}
    <h5 class="mb-3">Add Item</h5>
    {%else%}
    <h5 class="mb-3">Edit Item</h5>
    {%endif%}
    {{form.media}}
    <div class="container-fluid">
        {% crispy form %}
    </div>
</form>
