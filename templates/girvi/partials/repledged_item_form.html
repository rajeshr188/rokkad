{% load static %}
{% load crispy_forms_tags %}
<li class="list-group-item" id="form">
    {{instance}}
    {{ form.media }}
    <form method="post" action="{% if url %}{{ url }}{% else %}.{% endif %}" hx-post="{% if url %}{{ url }}{% else %}.{% endif %}" hx-target="#form" hx-swap="outerHTML">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="row">
            <div class="col-12 col-sm-6 col-lg-6">
                <div class="form-group">
                    {{ form.original_loanitem|as_crispy_field }}
                </div>
            </div>
            <div class="col-12 col-sm-6 col-lg-6">
                <div class="form-group">
                    {{ form.repledged_loanamount|as_crispy_field }}
                </div>
            </div>
            <div class="col-12 col-sm-6 col-lg-6">
                <div class="form-group">
                    {{ form.interest_rate|as_crispy_field }}
                </div>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-auto">
                <div class="form-group">
                    <button class="btn btn-success btn" type="submit">Save</button>
                    <button class="btn btn-danger btn" 
                    {% if object %} hx-get="{{ object.get_absolute_url }}" 
                    {% else %} _="on click transition opacity to 0 then remove #form" 
                    {% endif %}>Cancel</button>
                </div>
            </div>
        </div>
    </form>
</li>
