{% load static %}
{% csrf_token %}
<div class="modal-header">
    <h5 class="modal-title">📷 Item Pictures</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
    <input type="hidden" id="picture-modal-item-id" value="{{ item.id }}">
    <input type="hidden" id="picture-add-url" value="{% url 'girvi:loanitem_picture_add' item.id %}">

    <!-- Camera Capture Section -->
    <div class="card mb-4 bg-light">
        <div class="card-header">
            <h6 class="mb-0">📹 Camera Capture</h6>
        </div>
        <div class="card-body">
            <div class="row">
                <input type="hidden" id="image-data" name="image_data">
                <div class="col-12 mb-2">
                    <select id="videoSource" class="form-control"></select>
                </div>
                <div class="col-12 mb-2">
                    <div id="camera-status" class="small text-muted"></div>
                </div>
                <div class="col-12 col-lg-6">
                    <div class="camera mb-2">
                        <video id="video" style="width: 100%; max-height: 400px; background: #000; border-radius: 4px;">Video stream not available.</video>
                        <div class="d-flex gap-2 mt-2">
                            <button type="button" id="start-camera" class="btn btn-outline-primary btn-sm flex-fill">Start Camera</button>
                            <button type="button" id="capture-photo" class="btn btn-primary btn-sm flex-fill" disabled>📸 Take Photo</button>
                            <button type="button" id="stop-camera" class="btn btn-outline-secondary btn-sm flex-fill" disabled>Stop</button>
                        </div>
                    </div>
                    <canvas id="canvas" style="display: none;"></canvas>
                </div>
                <div class="col-12 col-lg-6">
                    <div class="output">
                        <img id="photo" alt="Captured photo will appear here" style="width: 100%; max-height: 400px; border: 1px solid #ddd; border-radius: 4px;" />
                    </div>
                    <div class="mt-3">
                        <label for="upload-photo" class="form-label small text-muted mb-1">Or upload from device</label>
                        <input type="file" id="upload-photo" class="form-control form-control-sm" accept="image/*">
                    </div>
                    <button type="button" id="add-captured-photo" class="btn btn-success btn-sm w-100 mt-2" disabled>✓ Add Photo</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Captured Pictures List -->
    <div class="card">
        <div class="card-header">
            <h6 class="mb-0">📸 Captured Pictures ({{ pictures.count }})</h6>
        </div>
        <div class="card-body" id="pictures-list">
            {% if pictures %}
                {% for pic in pictures %}
                    <div class="row mb-3 picture-item" data-pic-id="{{ pic.id }}">
                        <div class="col-3">
                            <img src="{{ pic.pic.url }}" alt="Picture" style="width: 100%; border-radius: 4px;">
                        </div>
                        <div class="col-9">
                            <textarea class="form-control form-control-sm mb-2" placeholder="Description..." maxlength="255">{{ pic.description }}</textarea>
                            <label class="form-check">
                                <input type="checkbox" class="form-check-input is-default-check" {% if pic.is_default %}checked{% endif %}>
                                <span class="form-check-label">Mark as default</span>
                            </label>
                            <button type="button" class="btn btn-sm btn-danger mt-2" data-pic-id="{{ pic.id }}">Delete</button>
                        </div>
                    </div>
                    <hr>
                {% endfor %}
            {% else %}
                <p class="text-muted">No pictures yet. Capture one using the camera above.</p>
            {% endif %}
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
</div>

<script>
(function() {
    const modal = document.getElementById('modal');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const photo = document.getElementById('photo');
    const imageInput = document.getElementById('image-data');
    const sourceSelect = document.getElementById('videoSource');
    const cameraStatus = document.getElementById('camera-status');
    const uploadInput = document.getElementById('upload-photo');
    const startCameraBtn = document.getElementById('start-camera');
    const capturePhotoBtn = document.getElementById('capture-photo');
    const stopCameraBtn = document.getElementById('stop-camera');
    const addBtn = document.getElementById('add-captured-photo');
    const addUrl = document.getElementById('picture-add-url').value;
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    let stream = null;

    function resetCaptureState() {
        imageInput.value = '';
        addBtn.disabled = true;
        addBtn.textContent = '✓ Add Photo';
        photo.removeAttribute('src');
        uploadInput.value = '';
        cameraStatus.className = 'small text-muted';
        cameraStatus.textContent = 'Start the camera or upload an image file.';
    }

    function setStatus(message, variant) {
        cameraStatus.className = `small ${variant || 'text-muted'}`;
        cameraStatus.textContent = message;
    }

    function stopStream() {
        if (!stream) {
            return;
        }
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        video.srcObject = null;
        startCameraBtn.disabled = false;
        capturePhotoBtn.disabled = true;
        stopCameraBtn.disabled = true;
        sourceSelect.disabled = false;
    }

    async function openCameraStream(selectedDeviceId) {
        const attempts = [];

        if (selectedDeviceId) {
            attempts.push({ video: { deviceId: { exact: selectedDeviceId } }, audio: false });
            attempts.push({ video: { deviceId: { ideal: selectedDeviceId } }, audio: false });
        }

        attempts.push({ video: { facingMode: 'user' }, audio: false });
        attempts.push({ video: { facingMode: 'environment' }, audio: false });
        attempts.push({ video: true, audio: false });

        let lastError = null;
        for (const constraints of attempts) {
            try {
                return await navigator.mediaDevices.getUserMedia(constraints);
            } catch (error) {
                lastError = error;
            }
        }

        throw lastError;
    }

    async function populateCameraOptions() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
            sourceSelect.innerHTML = '<option value="">Camera access unavailable</option>';
            sourceSelect.disabled = true;
            startCameraBtn.disabled = true;
            setStatus('Camera access is not available in this browser or context. Use file upload instead.', 'text-warning');
            return;
        }

        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const cameras = devices.filter(device => device.kind === 'videoinput');
            sourceSelect.innerHTML = '';

            if (!cameras.length) {
                sourceSelect.innerHTML = '<option value="">No cameras found</option>';
                sourceSelect.disabled = true;
                startCameraBtn.disabled = true;
                setStatus('No camera devices were found. Use file upload instead.', 'text-warning');
                return;
            }

            cameras.forEach((camera, index) => {
                const option = document.createElement('option');
                option.value = camera.deviceId;
                option.textContent = camera.label || `Camera ${index + 1}`;
                sourceSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Failed to enumerate cameras', error);
            sourceSelect.innerHTML = '<option value="">Could not load cameras</option>';
            setStatus('Could not load camera devices. Use file upload instead.', 'text-danger');
        }
    }

    async function startStream() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setStatus('Camera access is not supported in this browser or context. Use file upload instead.', 'text-warning');
            return;
        }

        stopStream();
        setStatus('Requesting camera access...', 'text-muted');

        try {
            const selectedDeviceId = sourceSelect.value;
            stream = await openCameraStream(selectedDeviceId);
            video.srcObject = stream;
            await video.play();

            startCameraBtn.disabled = true;
            capturePhotoBtn.disabled = false;
            stopCameraBtn.disabled = false;
            sourceSelect.disabled = true;
            setStatus('Camera ready. Click Take Photo to capture.', 'text-success');

            await populateCameraOptions();
        } catch (error) {
            console.error('Failed to access camera', error);
            let message = 'Could not access camera.';
            if (error && error.name === 'NotAllowedError') {
                message = 'Camera permission was denied. Allow camera access in the browser, or use file upload instead.';
            } else if (error && error.name === 'NotReadableError') {
                message = 'The camera is busy in another app. Close that app and try again, or use file upload.';
            } else if (error && error.name === 'NotFoundError') {
                message = 'No usable camera was found. Use file upload instead.';
            } else if (error && error.name === 'SecurityError') {
                message = 'Camera access requires a secure origin such as localhost or HTTPS. Use file upload or open the site on localhost.';
            } else if (error && error.message) {
                message = `Could not access camera: ${error.message}`;
            }
            setStatus(message, 'text-danger');
        }
    }

    function capturePhoto() {
        if (!stream) {
            alert('Start the camera first.');
            return;
        }

        const width = video.videoWidth || 640;
        const height = video.videoHeight || 480;
        canvas.width = width;
        canvas.height = height;

        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, width, height);

        const imageData = canvas.toDataURL('image/jpeg', 0.9);
        photo.src = imageData;
        imageInput.value = imageData;
        addBtn.disabled = false;
        setStatus('Photo captured. Click Add Photo to upload it.', 'text-success');
    }

    startCameraBtn.addEventListener('click', startStream);
    capturePhotoBtn.addEventListener('click', capturePhoto);
    stopCameraBtn.addEventListener('click', function() {
        stopStream();
        setStatus('Camera stopped. You can restart it or upload a file instead.', 'text-muted');
    });
    sourceSelect.addEventListener('change', function() {
        if (stream) {
            startStream();
        }
    });

    uploadInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) {
            return;
        }

        const reader = new FileReader();
        reader.onload = function(loadEvent) {
            const result = loadEvent.target.result;
            photo.src = result;
            imageInput.value = result;
            addBtn.disabled = false;
            stopStream();
            setStatus('Image selected from device. Click Add Photo to upload it.', 'text-success');
        };
        reader.readAsDataURL(file);
    });

    if (modal) {
        modal.addEventListener('hidden.bs.modal', stopStream, { once: false });
    }

    resetCaptureState();
    populateCameraOptions();

    addBtn.addEventListener('click', function() {
        const imageData = imageInput.value;
        if (!imageData) { alert('Please capture a photo first'); return; }

        addBtn.disabled = true;
        addBtn.textContent = 'Saving...';

        const base64Data = imageData.split(',')[1];
        const byteCharacters = atob(base64Data);
        const byteArray = new Uint8Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
            byteArray[i] = byteCharacters.charCodeAt(i);
        }
        const blob = new Blob([byteArray], {type: 'image/jpeg'});
        const file = new File([blob], 'photo_' + Date.now() + '.jpg', {type: 'image/jpeg'});

        const formData = new FormData();
        formData.append('pic', file);
        formData.append('description', '');

        fetch(addUrl, {
            method: 'POST',
            body: formData,
            headers: {'X-CSRFToken': csrfToken}
        })
        .then(response => {
            if (response.ok) {
                location.reload();
            } else {
                alert('Error saving picture');
                addBtn.disabled = false;
                addBtn.textContent = '✓ Add Photo';
            }
        })
        .catch(() => {
            alert('Upload failed');
            addBtn.disabled = false;
            addBtn.textContent = '✓ Add Photo';
        });
    });
})();
</script>
