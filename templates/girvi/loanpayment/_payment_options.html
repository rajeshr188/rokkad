{% if payment_options %}
<div class="card border-0 shadow-sm mb-4">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
      <div>
        <h6 class="mb-1">Payment Capture</h6>
        <div class="text-muted small">Use a preset split or type a custom amount below.</div>
      </div>
      <span class="badge bg-light text-dark border">Posts to accounting on save</span>
    </div>
    <div class="d-flex flex-wrap gap-2">
      {% for option in payment_options %}
      <button
        type="button"
        class="btn btn-sm {{ option.button_class }} js-payment-option"
        data-total="{{ option.total_amount }}"
        data-interest="{{ option.interest_amount }}"
        title="{{ option.description }}">
        {{ option.label }}: {{ option.total_amount }}
      </button>
      {% endfor %}
    </div>
  </div>
</div>
{% endif %}

<script>
  (function () {
    function setValue(selector, value) {
      const el = document.querySelector(selector);
      if (!el) return;
      el.value = value;
      el.dispatchEvent(new Event('change', { bubbles: true }));
    }

    document.querySelectorAll('.js-payment-option').forEach(function (button) {
      button.addEventListener('click', function () {
        setValue('#id_total_amount', button.dataset.total || '');
        setValue('#id_interest_amount', button.dataset.interest || '0');
      });
    });
  })();
</script>
