{% load i18n %}

<aside class="portal-sidebar" aria-label="{% trans 'Customer portal sections' %}">
    <div class="portal-sidebar-inner">
        <div class="portal-section-title">{% trans "My portal" %}</div>
        <nav class="portal-nav-list">
            <a class="portal-nav-link {% if portal_active_section == 'dashboard' %}active{% endif %}" href="{% url 'customer_portal_dashboard' %}">
                <i class="bi bi-speedometer2" aria-hidden="true"></i>
                <span>{% trans "Overview" %}</span>
            </a>
            <a class="portal-nav-link {% if portal_active_section == 'loans' %}active{% endif %}" href="{% url 'customer_portal_loans' %}">
                <i class="bi bi-gem" aria-hidden="true"></i>
                <span>{% trans "My loans" %}</span>
            </a>
            <a class="portal-nav-link {% if portal_active_section == 'invoices' %}active{% endif %}" href="{% url 'customer_portal_invoices' %}">
                <i class="bi bi-receipt" aria-hidden="true"></i>
                <span>{% trans "My invoices" %}</span>
            </a>
            <a class="portal-nav-link {% if portal_active_section == 'payments' %}active{% endif %}" href="{% url 'customer_portal_payments' %}">
                <i class="bi bi-wallet2" aria-hidden="true"></i>
                <span>{% trans "My payments" %}</span>
            </a>
            <a class="portal-nav-link {% if portal_active_section == 'documents' %}active{% endif %}" href="{% url 'customer_portal_documents' %}">
                <i class="bi bi-folder2-open" aria-hidden="true"></i>
                <span>{% trans "My documents" %}</span>
            </a>
            <a class="portal-nav-link {% if portal_active_section == 'statements' %}active{% endif %}" href="{% url 'customer_portal_statements' %}">
                <i class="bi bi-file-earmark-text" aria-hidden="true"></i>
                <span>{% trans "My statements" %}</span>
            </a>
        </nav>
        <div class="portal-sidebar-note">
            {% trans "Only records linked to your verified party are shown." %}
        </div>
    </div>
</aside>
