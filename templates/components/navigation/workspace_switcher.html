<!-- Workspace Switcher Dropdown -->
<div class="workspace-switcher mb-3">
    <div class="dropdown">
        <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button" id="workspaceDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-briefcase"></i>
            {% if request.user.profile.workspace %}
                <span class="fw-bold">{{ request.user.profile.workspace.name }}</span>
            {% else %}
                <span class="text-muted">Select Workspace</span>
            {% endif %}
        </button>
        <ul class="dropdown-menu w-100" aria-labelledby="workspaceDropdownBtn">
            {% for membership in request.user.memberships.all %}
                <li>
                    <a class="dropdown-item {% if request.user.profile.workspace.id == membership.company.id %}active{% endif %}" 
                       href="{% url 'workspace_select' membership.company.id %}">
                        <i class="bi bi-briefcase-fill"></i> {{ membership.company.name }}
                        {% if request.user.profile.workspace.id == membership.company.id %}
                            <i class="bi bi-check-lg float-end text-success"></i>
                        {% endif %}
                    </a>
                </li>
            {% empty %}
                <li><span class="dropdown-item-text text-muted">No workspaces</span></li>
            {% endfor %}
            <li><hr class="dropdown-divider"></li>
            <li>
                <a class="dropdown-item" href="{% url 'workspace_selector' %}?show_all=1">
                    <i class="bi bi-window-plus"></i> View All Workspaces
                </a>
            </li>
            <li>
                <a class="dropdown-item" href="{% url 'workspace_create' %}">
                    <i class="bi bi-plus-circle"></i> Create New
                </a>
            </li>
        </ul>
    </div>
</div>
