{% load orgs_tags %}
<!-- Permission-Gated Action Buttons Component -->
<!-- Usage: include 'components/permissions/action_buttons.html' with object=member actions=actions -->

{% if actions %}
<div class="action-buttons btn-group" role="group" aria-label="Actions">
    {% for action in actions %}
        {% if request.user|has_permission:action.permission %}
        <a href="{{ action.url }}" 
           class="btn btn-sm btn-{{ action.style }}"
           title="{{ action.title }}"
           {% if action.confirm %}
           onclick="return confirm('{{ action.confirm_message }}');"
           {% endif %}>
            {% if action.icon %}
            <i class="bi bi-{{ action.icon }}"></i>
            {% endif %}
            {{ action.label }}
        </a>
        {% endif %}
    {% endfor %}
</div>
{% endif %}

<style>
.action-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
}

.action-buttons .btn {
    flex: 0 1 auto;
    padding: 0.375rem 0.75rem;
    font-size: 0.875rem;
}

.action-buttons .btn i {
    margin-right: 0.375rem;
}

.action-buttons .btn-primary {
    background-color: #0d6efd;
    border-color: #0d6efd;
}

.action-buttons .btn-primary:hover {
    background-color: #0b5ed7;
    border-color: #0a58ca;
}

.action-buttons .btn-danger {
    background-color: #dc3545;
    border-color: #dc3545;
}

.action-buttons .btn-danger:hover {
    background-color: #bb2d3b;
    border-color: #b02a37;
}

.action-buttons .btn-warning {
    background-color: #ffc107;
    border-color: #ffc107;
    color: #000;
}

.action-buttons .btn-warning:hover {
    background-color: #ffbb06;
    border-color: #fa9f01;
}

.action-buttons .btn-secondary {
    background-color: #6c757d;
    border-color: #6c757d;
}

.action-buttons .btn-secondary:hover {
    background-color: #5c636a;
    border-color: #565e64;
}

/* Disabled state for permission-denied actions */
.action-buttons .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
</style>
