{% extends "base_tenant.html" %}
{% load crispy_forms_tags %}

{% block title %}Export Data{% endblock %}

{% block workspace_content %}
<div class="container py-3">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
            <h1 class="h4 mb-1">Export Data</h1>
            <p class="text-muted mb-0">Export selected tenant models for review or migration.</p>
        </div>
        <a class="btn btn-outline-secondary" href="{% url 'data_import:import_data' %}">
            <i class="bi bi-upload me-1"></i> Import
        </a>
    </div>

    <div class="card col-lg-8">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-download me-1"></i> Export
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
